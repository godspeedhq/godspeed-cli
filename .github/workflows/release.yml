name: release

# Push a tag `cli-v<version>` (equal to Cargo.toml's version) to release the CLI:
#
#   build      one binary per supported workstation, each run once where the runner can execute it
#   installers install.sh and install.ps1 tested against exactly those binaries, served locally, on Linux,
#              macOS and Windows - before anything is published
#   publish    a DRAFT GitHub Release: the binaries, SHA256SUMS and both install scripts. Nothing is public
#              until a maintainer publishes the draft; `releases/latest` (what the installers fetch) never
#              resolves to a draft.
#
# For a dry run - everything but publish - run it by hand (workflow_dispatch, once it is on main), or push
# any commit to the branch `dry-run/release`. (It is deliberately not run on pull requests: GitHub filters a
# PR's paths against the whole PR, so it would rebuild six targets on every push to any PR that ever
# touched this file.)

on:
  push:
    tags: ['cli-v*']
    branches: ['dry-run/release']
  workflow_dispatch:

permissions:
  contents: read

# A newer dry run supersedes an older one; a tagged release is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds are static (musl): one binary runs on any distribution.
          # armv7 and riscv64 Linux hosts are deliberately absent: cheap to cross-build, but GitHub has no
          # runners for either, so they could only be tested under QEMU. (Packages - what the CLI builds -
          # cover all four Godspeed ISAs regardless; this matrix is only where the CLI itself runs.)
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, runs: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, runs: true }
          - { target: aarch64-apple-darwin, os: macos-latest, runs: true }
          - { target: x86_64-apple-darwin, os: macos-latest, runs: false } # cross-built on Apple silicon
          - { target: x86_64-pc-windows-msvc, os: windows-latest, runs: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, runs: false } # cross-built on x64
    steps:
      - uses: actions/checkout@v5

      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#cli-v}"
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $want, Cargo.toml says $have"
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      # TLS (rustls, through ring) compiles a little C: static Linux builds need musl's C toolchain, and ring
      # needs clang to build for Arm64 Windows.
      - name: C toolchain for ring
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *-linux-musl) sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools ;;
            aarch64-pc-windows-msvc) echo 'C:/Program Files/LLVM/bin' >> "$GITHUB_PATH" ;;
          esac

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name it for the release
        shell: bash
        run: |
          mkdir dist
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/godspeed$ext" "dist/godspeed-${{ matrix.target }}$ext"
          ls -l dist

      - name: It runs, and reports the version being released
        if: matrix.runs
        shell: bash
        run: |
          out=$(dist/godspeed-${{ matrix.target }}* --version)
          echo "$out"
          want=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "$out" = "godspeed $want" ]

      - uses: actions/upload-artifact@v4
        with:
          name: godspeed-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  installers:
    name: Installers on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          if command -v sha256sum > /dev/null; then sha256sum godspeed-*; else shasum -a 256 godspeed-*; fi \
            | sed 's/ \*/  /' > SHA256SUMS
          cat SHA256SUMS
      - name: install.sh
        if: runner.os != 'Windows'
        run: bash install/test/installers.sh dist
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/test/installers.ps1 -Dist dist

  publish:
    name: Draft the GitHub Release
    needs: [build, installers]
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble
        working-directory: dist
        run: |
          cp ../install/install.sh ../install/install.ps1 .
          sha256sum godspeed-* install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          # The release's own notes, reviewed in a pull request like any other change, come first.
          : > notes.md
          if [ -f ".github/release-notes/$GITHUB_REF_NAME.md" ]; then
            cat ".github/release-notes/$GITHUB_REF_NAME.md" >> notes.md
            printf '\n## ⬇️ Install\n\n' >> notes.md
          fi
          cat >> notes.md <<EOF
          Install on Linux or macOS:

              curl --proto '=https' --tlsv1.2 -sSf https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh

          Install on Windows (PowerShell):

              irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex

          The installers check each binary against SHA256SUMS before running it. A checksum shows the file is
          the one this release lists; releases are not signed yet.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "🚀 godspeed $version" --notes-file notes.md
