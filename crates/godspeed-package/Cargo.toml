[package]
name = "godspeed-package"
# Versioned independently of the CLI: this crate is the package contract, shared with the native package
# manager, and changes on its own schedule (see FORMAT in src/manifest.rs for the manifest's own version).
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Godspeed package contract: manifest types, their validation, and artifact verification. no_std, no allocator."
rust-version = "1.80"

[features]
default = []
# Read and write the TOML manifest. Host-only: it needs std and a heap. The core of the crate never does.
toml = ["std", "dep:serde", "dep:toml"]
# Writing and signing trust metadata (the maintainer's tool, the registry). Needs std and a heap.
std = []

[dependencies]
# `force-soft`: the portable implementation. The x86 SIMD path cannot build for `x86_64-unknown-none` (no
# SSE; it crashes rustc), and the native package manager runs on exactly that kind of target.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
# Publisher signatures. No default features: no std, no alloc, no randomness (keys are made by the caller).
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
