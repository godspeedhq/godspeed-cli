# Godspeed project manifest. It says what kind of project this is, where its contract is, and what a
# package of it says about itself. Name, version, the authority the driver requests and the device it
# drives live in the contract, not here.
format   = 1
kind     = "driver"
contract = "contracts/{{name}}.toml"

description = "A Godspeed driver"

# The namespace a package of this driver is published under: "alice" makes it alice/{{name}}.
# `godspeed package` needs it.
# publisher = "your-name"
# license   = "MIT"
